[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-support-agent"
version = "1.0.0"
description = "Autonomous Customer Support & Action Agent with LangGraph and deterministic controls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.1.0",
    "pyjwt[crypto]>=2.9.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.2",
    "email-validator>=2.2.0",
    "langgraph>=0.2.28",
    "langchain-core>=0.3.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "python-dotenv>=1.0.1",
    "sentry-sdk[fastapi]>=2.18.0",
]

[tool.setuptools.packages.find]
where = ["apps/api"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py312"
