services:
  - type: web
    name: agent-v-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: PYTHONPATH=apps/api alembic upgrade head && PYTHONPATH=apps/api uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: CHECKPOINT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        value: https://agent-v-tau.vercel.app
      - key: ALLOWED_HOSTS
        value: agent-v.onrender.com,localhost,127.0.0.1
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_STARTTLS
        value: "true"
      - key: ACTION_GATEWAY_URL
        sync: false
      - key: ACTION_GATEWAY_API_KEY
        sync: false
      - key: JWT_SIGNING_KEY
        sync: false
      - key: JWT_ISSUER
        value: agent-v-auth
      - key: JWT_AUDIENCE
        value: agent-v-api
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/models
      - key: CORS_ALLOWED_ORIGINS
        value: https://agent-v-tau.vercel.app
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
