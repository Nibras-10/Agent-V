services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set a long URL-safe REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [private]

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set Supabase postgresql+asyncpg URL in .env}
    restart: "no"
    networks: [private, edge]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      APP_ENV: production
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?Set Supabase postgresql+asyncpg URL in .env}
      CHECKPOINT_DATABASE_URL: ${CHECKPOINT_DATABASE_URL:?Set direct/session PostgreSQL URL for LangGraph in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set a random 32+ character signing key}
      JWT_ISSUER: ${JWT_ISSUER:-agent-v-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-agent-v-api}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-60}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      FRONTEND_URL: https://${DOMAIN:?Set a DNS name in .env}
      ALLOWED_HOSTS: ${DOMAIN},api,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      LLM_PROVIDER: gemini
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      LLM_API_KEY: ${LLM_API_KEY:?Set the Gemini API key in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/models}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Set SMTP_FROM_EMAIL in .env}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
      ACTION_GATEWAY_URL: ${ACTION_GATEWAY_URL:?Set your idempotent HTTPS provider gateway URL in .env}
      ACTION_GATEWAY_API_KEY: ${ACTION_GATEWAY_API_KEY:?Set your provider gateway secret in .env}
      MAX_AGENT_ATTEMPTS: ${MAX_AGENT_ATTEMPTS:-3}
      MAX_LLM_CALLS_PER_RUN: ${MAX_LLM_CALLS_PER_RUN:-8}
      MAX_TOOL_CALLS_PER_RUN: ${MAX_TOOL_CALLS_PER_RUN:-12}
      MAX_TOTAL_TOKENS_PER_RUN: ${MAX_TOTAL_TOKENS_PER_RUN:-10000}
      APPROVAL_EXPIRY_MINUTES: ${APPROVAL_EXPIRY_MINUTES:-60}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    networks: [private, edge]

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?Set a DNS name in .env}
    expose: ["3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    networks: [edge]

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set a DNS name in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge]

volumes:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  private:
    internal: true
